[package]
name = "audio-sticker-bot"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
# Pin sama dengan README whatsapp-rust (sudah memuat audio_sticker_message di wrapper list).
# Kalau zip lokal Anda lebih baru, pakai: whatsapp-rust = { path = "../whatsapp-rust-main" }
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "7e5c198e1a25ea405faa7a69a47bc727ea15484c" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "time", "fs"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
