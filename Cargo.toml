[package]
name = "audio-sticker-bot"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", branch = "main" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "time", "fs"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
