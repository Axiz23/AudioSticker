name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runner native per arsitektur; ubuntu-22.04 supaya binary kompatibel dengan glibc lama.
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config cmake

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Build
        run: cargo build --release

      - name: Collect binary
        run: |
          mkdir -p dist
          cp target/release/audio-sticker-bot dist/audio-sticker-bot-linux-${{ matrix.arch }}
          strip dist/audio-sticker-bot-linux-${{ matrix.arch }}
          chmod +x dist/audio-sticker-bot-linux-${{ matrix.arch }}
          file dist/audio-sticker-bot-linux-${{ matrix.arch }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: audio-sticker-bot-linux-${{ matrix.arch }}
          path: dist/audio-sticker-bot-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
