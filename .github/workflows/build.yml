name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Resolve dependencies
        run: go mod tidy

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Cross compile
        run: make dist

      - uses: actions/upload-artifact@v4
        with:
          name: audio-sticker-bot
          path: dist/*
